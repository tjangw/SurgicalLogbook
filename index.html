<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ee">
<title>Surgical Logbook</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logbook">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f4f2ee; --card:#ffffff; --card2:#f8f6f2; --solid:#ffffff; --field:#ffffff; --bar:rgba(244,242,238,.94);
  --glass:#e9e5de; --blur:none;
  --ink:#1d1e26; --ink2:#4f5160; --muted:#7a7c8a; --line:#e9e5de;
  --accent:#1a1c24; --accent-ink:#ffffff;
  --sage:#3f7d61; --sage-soft:#e2efe7; --calm:#5b6070; --calm-soft:#eceef2; --terra:#d4683f;
  --danger:#b03a2e; --danger-soft:#f8e3de; --warn-bg:#f8e7d6; --warn-ink:#7d4416; --star:#c98a1e; --chip:#f0ede8;
  --s1:#2f3340; --s2:#5f9a7e; --s3:#f1c9b6;
  --hero:linear-gradient(140deg,#2b2f3b,#1a1c24); --hero-ink:#ffffff; --hero-mute:rgba(255,255,255,.72);
  --shadow:0 1px 1px rgba(40,30,20,.04),0 6px 14px rgba(40,30,20,.06),0 22px 40px -12px rgba(40,30,20,.16);
  --serif:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#17181d; --card:#22232b; --card2:#2a2b34; --solid:#22232b; --field:#262731; --bar:rgba(23,24,29,.94);
    --glass:#2e2f39;
    --ink:#f1efe9; --ink2:#c9c7d0; --muted:#8f90a0; --line:#30313b;
    --accent:#d9dce6; --accent-ink:#1a1c24;
    --sage:#8fd0ae; --sage-soft:#22342b; --calm:#aeb3c2; --calm-soft:#2a2c35; --terra:#ec8a62;
    --danger:#ec9384; --danger-soft:#3a2420; --warn-bg:#3a2f1a; --warn-ink:#ecd29b; --star:#e5a945; --chip:#2c2d37;
    --s1:#b9bfd0; --s2:#7fbf9e; --s3:#6e4636;
    --hero:linear-gradient(140deg,#30343f,#1e2028); --hero-ink:#ffffff; --hero-mute:rgba(255,255,255,.7);
    --shadow:0 10px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#17181d; --card:#22232b; --card2:#2a2b34; --solid:#22232b; --field:#262731; --bar:rgba(23,24,29,.94);
  --glass:#2e2f39;
  --ink:#f1efe9; --ink2:#c9c7d0; --muted:#8f90a0; --line:#30313b;
  --accent:#d9dce6; --accent-ink:#1a1c24;
  --sage:#8fd0ae; --sage-soft:#22342b; --calm:#aeb3c2; --calm-soft:#2a2c35; --terra:#ec8a62;
  --danger:#ec9384; --danger-soft:#3a2420; --warn-bg:#3a2f1a; --warn-ink:#ecd29b; --star:#e5a945; --chip:#2c2d37;
  --s1:#b9bfd0; --s2:#7fbf9e; --s3:#6e4636;
  --hero:linear-gradient(140deg,#30343f,#1e2028); --hero-ink:#ffffff; --hero-mute:rgba(255,255,255,.7);
  --shadow:0 10px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:var(--serif)}
.logo{display:inline-block;background:currentColor;-webkit-mask:url(logo.png) center/contain no-repeat;mask:url(logo.png) center/contain no-repeat}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 20px 10px;display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
header.top h1{font-family:var(--serif);font-weight:600;font-size:28px;margin:0;flex:1;letter-spacing:-.01em;line-height:1.1}
header.top .logo{width:18px;height:36px;color:var(--ink)}
.sq{border:0;width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none;font-size:18px}
.sq.ghost{background:var(--chip);color:var(--ink)}
main{padding:4px 20px calc(110px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
/* floating nav + side FAB */
nav.tabs{position:fixed;left:16px;right:92px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:10;background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;justify-content:space-around;align-items:center;padding:6px;box-shadow:var(--shadow);max-width:520px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);padding:6px 4px;cursor:pointer;flex:1;border-radius:16px}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button.on{color:var(--ink);background:var(--card2);font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:11;width:62px;height:62px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 24px rgba(30,20,10,.28);transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px}
body.sheet nav.tabs,body.sheet .fab{display:none}
body.sheet main{animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
/* cards */
.card{background:var(--card);border-radius:20px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 12px}
.card h2 small{font-family:system-ui,sans-serif;font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:20px 20px 18px;margin:0 0 12px}
.hero .eyebrow{color:var(--hero-mute)}
.hero .big{font-family:var(--serif);font-size:64px;font-weight:600;line-height:1;letter-spacing:-.02em}
.hero .sub{color:var(--hero-mute);font-size:13px;margin-top:6px}
.hero .logo{position:absolute;right:-18px;top:-14px;width:120px;height:236px;color:var(--hero-ink);opacity:.08}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--shadow);min-width:0;text-align:left;color:inherit;font:inherit}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:16px}
.tile .eb{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tile .num{font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-top:4px}
.tile .num small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.tile .sub{font-size:12px;color:var(--ink2);margin-top:2px}
.tile .up{color:var(--sage);font-weight:600}
.tile .down{color:var(--muted);font-weight:600}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:700;letter-spacing:-.03em}
.kv{font-size:12.5px;color:var(--ink2);display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:6px}
.kv b{color:var(--ink);font-weight:600;text-align:right}
.spark{display:flex;align-items:flex-end;gap:3px;height:30px;margin-top:10px}
.spark i{flex:1;background:var(--s3);border-radius:3px 3px 0 0;min-height:2px}
.spark i:last-child{background:var(--s1)}
.mile .op{font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.25;margin-top:8px}
.mile .cm{font-size:12px;color:var(--muted);font-style:italic;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.split{flex:1;height:10px;border-radius:999px;overflow:hidden;display:flex;background:var(--chip)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;background:var(--sage-soft);color:var(--sage);margin-bottom:6px}
.pill.c{background:var(--calm-soft);color:var(--calm)}
.pill.w{background:var(--warn-bg);color:var(--star)}
.prog{height:6px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--s1);border-radius:999px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.filters select,.filters input{flex:1 1 130px;min-width:0;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.filters input[type=search]{flex-basis:100%}
.hbar{display:grid;grid-template-columns:minmax(96px,40%) 1fr 34px;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.hbar .lab{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:12px}
.hbar .fill{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hsep{border-top:1px dashed var(--line);margin:10px 0 4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:-4px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cols{display:flex;align-items:flex-end;gap:4px;height:150px;border-bottom:1px solid var(--line);padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer;gap:2px;border-radius:6px}
.col .seg{width:100%;min-height:0}
.col .seg.top{border-radius:4px 4px 0 0}
.col.sel{background:var(--card2)}
.collabels{display:flex;gap:4px;font-size:10px;color:var(--muted);margin-top:4px}
.collabels span{flex:1;text-align:center}
.readout{font-size:13px;color:var(--ink2);margin-top:10px;min-height:20px}
.toplist{margin:0;padding:0;list-style:none}
.toplist li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.toplist li:last-child{border:0}
.toplist .c{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.monthhead{font-family:var(--serif);font-size:17px;font-weight:600;margin:20px 2px 8px}
.case{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 8px;cursor:pointer;box-shadow:var(--shadow)}
.case .r1{display:flex;gap:6px;align-items:baseline;font-weight:600}
.case .r1 .op{flex:1}
.case .meta{font-size:12px;color:var(--ink2);margin-top:3px}
.case .cm{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.star{color:var(--star)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.badge.p{background:var(--sage-soft);color:var(--sage);font-weight:600}
.badge.s{background:var(--calm-soft);color:var(--calm);font-weight:600}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.field{margin:0 0 16px}
.field>label,.field>.lbl{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:0 0 7px;text-transform:uppercase;letter-spacing:.12em}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.inp:focus{outline:2px solid var(--ink);outline-offset:-1px}
textarea.inp{min-height:100px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span,.chip.btn{display:inline-block;padding:8px 14px;border-radius:999px;background:var(--chip);border:1px solid transparent;font-size:14px;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.btn{border:1px dashed var(--muted);background:none;color:var(--ink2)}
.rolehint{font-size:12px;color:var(--calm);margin-top:6px}
.sugg{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:6px;overflow:hidden;box-shadow:var(--shadow)}
.sugg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 14px;cursor:pointer}
.sugg button:last-child{border:0}
.sugg button small{color:var(--muted);margin-left:6px;font-style:italic}
.sugg .new{font-weight:600}
.newop{margin-top:8px;padding:12px;border-radius:14px;background:var(--warn-bg);color:var(--warn-ink);font-size:13px}
.newop select{margin-top:6px}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 12px;padding:0 14px}
details.sec summary{padding:14px 0;font-family:var(--serif);font-size:17px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"+";font-family:system-ui;font-size:20px;color:var(--muted)}
details.sec[open] summary::after{content:"–"}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--ink)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:600;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.dng{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.block{display:block;width:100%}
.savebar{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 calc(14px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 -14px 14px -2px var(--bg);margin-top:8px}
.savebar .btn{flex:1}
.list .it{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.list .it .nm{flex:1;min-width:0}
.list .it .nm small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{border:0;background:var(--chip);border-radius:10px;width:34px;height:34px;cursor:pointer;color:var(--ink2);flex:none}
.link{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.link:last-child{border:0}
.link .c{color:var(--muted);font-size:13px}
.catlabel{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:16px 0 2px}
.imp{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.imp select{width:100%;margin-top:4px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.imp .raw{color:var(--muted);font-style:italic}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .logo{width:44px;height:86px;color:var(--ink);opacity:.8}
.empty h2{font-family:var(--serif);color:var(--ink);font-size:24px;margin:14px 0 6px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.note{font-size:13px;color:var(--ink2);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin:0 0 12px}
#modal{position:fixed;inset:0;z-index:40;background:rgba(20,15,10,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
#modal[hidden]{display:none}
#modal.top{align-items:flex-start;padding-top:calc(env(safe-area-inset-top) + 60px)} /* keeps a text box above the phone keyboard */
#mMsg:empty{display:none}
#modal .box{background:var(--card);border-radius:24px;padding:22px 20px calc(16px + env(safe-area-inset-bottom));width:100%;max-width:440px;animation:rise .22s ease-out}
#modal h3{font-family:var(--serif);font-size:24px;margin:0 0 6px}
#modal p{margin:0 0 18px;color:var(--ink2)}
#modal .mb{display:flex;flex-direction:column;gap:8px}
@media (max-width:380px){.tile .num{font-size:32px}.tiles{gap:8px}.hero .big{font-size:54px}.ring{width:80px;height:80px}}
/* ---- Floating paper: solid cards lifted off a warm page with soft layered shadows ---- */
html,body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card,.tile,.case,details.sec,nav.tabs,.sugg,.note{border:1px solid var(--glass)}
.tile .eb.c1{color:var(--s1)} .tile .eb.c2{color:var(--terra)} .tile .eb.c3{color:var(--star)}
.spark i:last-child{background:var(--terra)}
.card .eyebrow{color:var(--calm)}
.card,.tile,.case,details.sec,nav.tabs{box-shadow:var(--shadow)}
.note{background:var(--card2)}
.hero{border:1px solid rgba(255,255,255,.22);box-shadow:var(--shadow)}
.inp,.filters select,.filters input,.imp select{background:var(--field);border-color:var(--glass)}
.filters select,.filters input{box-shadow:0 4px 12px rgba(40,30,60,.06)}
header.top{background:transparent}
header.top::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bar);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:.85}
header.top{position:sticky;isolation:isolate}
header.top h1{font-weight:700;font-size:26px;letter-spacing:-.03em}
.card h2,.monthhead,details.sec summary,#modal h3,.empty h2{font-weight:650;letter-spacing:-.02em}
.card h2{font-size:17px}
.hero .big{font-weight:700;letter-spacing:-.045em}
.savebar{background:var(--bar);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:none;margin:8px -20px 0;padding:12px 20px calc(14px + env(safe-area-inset-bottom))}
#modal .box{background:var(--solid)}
.case .cm{font-style:normal}
.fab{box-shadow:0 12px 26px rgba(20,10,40,.3)}
.row>*{min-width:0}
.chip input[type=checkbox]:checked+span::before{content:"✓ "}
.aiout{white-space:pre-wrap;font-size:14px;line-height:1.55;margin:0}
.aiqs{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink2)}
.aiqs li{margin:4px 0}
.steprow{margin:12px 0}
.steprow .t{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.steprow .t b{font-variant-numeric:tabular-nums}
.steprow .prog{margin-top:5px}
.steprow .d{font-size:11.5px;color:var(--muted);margin-top:3px}
.toplist li[data-act]{cursor:pointer}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.acts .btn{flex:1 1 auto}
.banner{display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:var(--warn-ink);border-radius:16px;padding:10px 12px 10px 14px;margin:0 0 12px;font-size:13px}
.banner span{flex:1}
/* computer screens: wider page, navigation centred under it */
@media (min-width:900px){
  header.top,main{max-width:860px}
  nav.tabs{left:50%;right:auto;transform:translateX(-50%);width:420px}
  .fab{right:auto;left:calc(50% + 222px)}
}
@media print{
  html,body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header.top .sq,nav.tabs,.fab,#toast,.noprint{display:none!important}
  header.top::before{display:none}
  main{padding:0}
  .card,.tile,.hero,.case{box-shadow:none!important;break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <button class="sq ghost" id="back" hidden data-act="back" aria-label="Back">‹</button>
  <span class="logo" id="hlogo" aria-hidden="true"></span>
  <h1 id="title">Logbook</h1>
</header>
<main id="main"></main>
<nav class="tabs">

const opSteps=n=>STEPS[n]?STEPS[n].split('|'):[];
function defaultSettings(){
  return {
    roles:[{name:'Primary unsupervised',primary:true},{name:'Primary supervised',primary:true},{name:'Co-primary',primary:true},{name:'1st assist',primary:false},{name:'2nd assist',primary:false}],
    locations:[{name:'RMH',aliases:['Royal Melbourne']},{name:'Peter Mac',aliases:['PMCC','Peter MacCallum']},{name:'Horsham',aliases:['Wimmera Base']},{name:'Launceston',aliases:['LGH']},{name:'Wangaratta',aliases:['Northeast Health']}],
    categories:CATEGORIES.slice(),
    operations:OPS.map(([name,category,al,scope])=>({name,category,aliases:al?al.split(',').map(s=>s.trim()):[],scope:!!scope,steps:opSteps(name)})),
    approaches:['Open','Laparoscopic','Robotic','Endoscopic','Percutaneous'],
    urgencies:['Elective','Emergency'],
    asa:['I','II','III','IV','V'],
    complications:['None','Clavien-Dindo I','Clavien-Dindo II','Clavien-Dindo IIIa','Clavien-Dindo IIIb','Clavien-Dindo IVa','Clavien-Dindo IVb','Clavien-Dindo V'],
    consultants:[],
    sexes:['Male','Female','Other'],
    customFields:[],
    hidden:[],
    primaryAssumption:'Primary supervised',
    lastLocation:'',
    rotations:[],
    backup:{every:7,last:0},
    v:3
  };
}

/* ---------- Storage ---------- */
const KEY='surgical-logbook-v1';
let db=load(); let S=db.settings;
function load(){
  try{const j=JSON.parse(localStorage.getItem(KEY)); if(j&&j.settings&&Array.isArray(j.cases)) return j;}catch(e){}
  return {cases:[],settings:defaultSettings()};
}
// touch=false for housekeeping saves that shouldn't count as a change needing backup
function save(touch=true){ if(touch) db.modified=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('Could not save on this device');} syncChanged(); }
function migrate(){
  if(!(S.v>=2)){
    ['Colonoscopy','Gastroscopy','Flexible sigmoidoscopy'].forEach(n=>{const o=opByName(n);if(o&&o.scope===undefined)o.scope=true;});
    S.v=2;
  }
  if(!(S.v>=3)){
    S.operations.forEach(o=>{if(!o.steps)o.steps=opSteps(o.name);});
    S.v=3;
  }
  S.rotations=S.rotations||[]; S.backup=S.backup||{every:7,last:0};
  S.operations.forEach(o=>{o.steps=o.steps||[];});
  db.cases.forEach(c=>{
    if(!c.id) c.id=uid();
    if(c.importNote&&/assumed Primary supervised/.test(c.importNote)) c.importNote=c.importNote.split('; ').filter(x=>!/assumed Primary supervised/.test(x)).join('; ');
    if(isScopeOp(c.operation)&&c.role&&!SCOPE_ROLES.includes(c.role)){const r=scopeRole(c.role,c.comments);c.role=r.role;if(r.note)c.importNote=[c.importNote,r.note].filter(Boolean).join('; ');}
  });
  save(false);
}

/* ---------- Backups ---------- */
// Snapshots: copies kept inside the app on this device, to undo mistakes (last SNAP_MAX)
const SNAP_MAX=15;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('logbook-snapshots',1);r.onupgradeneeded=()=>r.result.createObjectStore('snaps',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function snapAll(){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('snaps').objectStore('snaps').getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>b.id-a.id));q.onerror=()=>rej(q.error);});}
function snapshot(reason){
  const data=JSON.stringify(db), n=db.cases.length; // copy now, before the caller changes anything
  return (async()=>{
    try{
      if(!n) return;
      const all=await snapAll();
      if(all[0]&&all[0].data===data) return; // nothing changed since the last copy
      const d=await idb(), tx=d.transaction('snaps','readwrite'), st=tx.objectStore('snaps');
      st.put({id:Date.now(),reason,n,data});
      all.slice(SNAP_MAX-1).forEach(s=>st.delete(s.id));
      await new Promise(r=>{tx.oncomplete=r;tx.onerror=r;});
    }catch(e){}
  })();
}
// Off-device backup: on a phone this opens the share menu (choose Drive); on a computer it downloads.
// Saved as .txt because Android won't share .json files; import reads either.
async function backupNow(){
  const name=`surgical-logbook-backup-${stamp()}`;
  const text=JSON.stringify({app:'surgical-logbook',version:1,exported:new Date().toISOString(),...db},null,1);
  const phone=matchMedia('(pointer:coarse)').matches;
  try{
    const file=new File([text],name+'.txt',{type:'text/plain'});
    if(phone&&navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file],title:'Logbook backup'});
    else download(name+'.json',new Blob([text],{type:'application/json'}));
  }catch(e){ if(e.name==='AbortError') return; download(name+'.json',new Blob([text],{type:'application/json'})); }
  S.backup.last=Date.now(); save(false); toast('Backup saved ✓'); render();
}
const daysSince=t=>Math.floor((Date.now()-t)/864e5);
// With sync on, the account already holds a copy, so the reminder drops to at most monthly
const backupDue=()=>db.cases.length&&S.backup.every>0&&(db.modified||1)>(S.backup.last||0)&&daysSince(S.backup.last||0)>=(Y?Math.max(S.backup.every,30):S.backup.every);

/* ---------- Helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const nm=it=>typeof it==='string'?it:it.name;
const opByName=n=>S.operations.find(o=>o.name===n);
const catOf=n=>(opByName(n)||{}).category||'Uncategorised';
const isScopeOp=n=>!!(opByName(n)||{}).scope;
const isScopeRole=r=>SCOPE_ROLES.includes(r);
const isPrimary=r=>!!(S.roles.find(x=>x.name===r)||{}).primary;
const fmtDate=d=>{if(!d)return'No date';const[y,m,dd]=d.split('-');return `${+dd} ${MON[+m-1]} ${y}`;};
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const byDateDesc=(a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0);
const inRot=(r,c)=>!!c.date&&c.date>=r.start&&c.date<=r.end&&(!r.locations.length||r.locations.includes(c.location));
const rotCases=r=>db.cases.filter(c=>inRot(r,c));
const rotLabel=r=>`${fmtDate(r.start)} – ${fmtDate(r.end)}`;
const hbars=rows=>{const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map(([n,v,col])=>`<div class="hbar" title="${esc(n)}: ${v}"><span class="lab">${esc(n)}</span><div class="track"><div class="fill" style="width:${v/mx*100}%;background:${col}"></div></div><span class="v">${v}</span></div>`).join('');};
function ringHtml(pct){const R=41.5,C=2*Math.PI*R;return `<div class="ring"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="${R}" fill="none" stroke="var(--chip)" stroke-width="9"/><circle cx="46" cy="46" r="${R}" fill="none" stroke="var(--s1)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}"/></svg><b>${pct}%</b></div>`;}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200);}
// In-app dialogs. Used instead of the browser's prompt/confirm/alert, which some windows block.
function ask(title,msg,btns,field){
  return new Promise(res=>{
    $('#mTitle').textContent=title; $('#mMsg').textContent=msg;
    $('#mBtns').innerHTML=btns.map(([k,l,cls])=>`<button class="btn ${cls||''}" data-k="${k}">${esc(l)}</button>`).join('');
    const m=$('#modal'), inp=$('#mInp'); m.hidden=false;
    m.classList.toggle('top',!!field); inp.hidden=!field; inp.value=field?field.value||'':''; inp.placeholder=field&&field.placeholder||'';
    const done=k=>{m.hidden=true;m.onclick=null;inp.onkeydown=null;res(k);};
    m.onclick=e=>{const b=e.target.closest('[data-k]');if(b)done(b.dataset.k);else if(e.target===m)done('cancel');};
    if(field){inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();done('ok');}};inp.focus();inp.select();}
  });
}
// returns the typed text, or null if cancelled
async function askText(title,msg,opts={}){
  const k=await ask(title,msg,[['ok',opts.btn||'Save','pri'],['cancel','Cancel','']],opts);
  return k==='ok'?$('#mInp').value.trim():null;
}
const askYes=async(title,msg,btn,cls='pri')=>await ask(title,msg,[['yes',btn,cls],['cancel','Cancel','']])==='yes';
const notice=(title,msg)=>ask(title,msg,[['ok','OK','pri']]);

/* ---------- Smart matching ---------- */
const EXPAND={lap:'laparoscopic',lapar:'laparoscopic',chole:'cholecystectomy',appy:'appendicectomy',appendix:'appendicectomy',appendectomy:'appendicectomy',appendicetomy:'appendicectomy',
  colonscopy:'colonoscopy',cscope:'colonoscopy',ogd:'gastroscopy',icc:'intercostal catheter',lac:'laceration',bx:'biopsy',ln:'lymph node',wle:'wide local excision',
  ssg:'skin graft',ftsg:'skin graft',slnb:'sentinel lymph node biopsy',slnbx:'sentinel lymph node biopsy',bka:'below knee amputation',hemi:'hemicolectomy',
  masectomy:'mastectomy',umbi:'umbilical',hartmanns:'hartmann',harmanns:'hartmann',harmann:'hartmann',sb:'small bowel',tx:'transplant',renal:'kidney',
  ressection:'resection',resction:'resection',lipomas:'lipoma',cysts:'cyst',abcess:'abscess',absess:'abscess'};
const STOP=new Set(['and','of','the','with','a','an','for','left','right','bilateral','lt','rt','l','r','plus','to','in','on','procedure','op']);
function norm(s){
  s=String(s||'').toLowerCase().replace(/['’]/g,'');
  s=s.replace(/\bi\s*(&|and|n)\s*d\b/g,' incision drainage ').replace(/\bc[\s-]?scope\b/g,' colonoscopy ');
  return s.replace(/[^a-z0-9]+/g,' ').trim().split(' ').map(t=>EXPAND[t]??t).join(' ').split(' ').filter(t=>t&&!STOP.has(t)).join(' ');
}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
const tokEq=(a,b)=>a===b||(a.length>=5&&b.length>=5&&lev(a,b)<=(Math.min(a.length,b.length)>=8?2:1));
function bigrams(s){const g=new Map();for(let i=0;i<s.length-1;i++){const k=s.slice(i,i+2);g.set(k,(g.get(k)||0)+1);}return g;}
function dice(a,b){if(!a||!b)return 0;const A=bigrams(a),B=bigrams(b);let x=0;for(const[k,v]of A)x+=Math.min(v,B.get(k)||0);return 2*x/((a.length-1)+(b.length-1)||1);}
function scoreText(q,c){
  if(!q||!c)return 0; if(q===c)return 1;
  const Q=q.split(' '),C=c.split(' ');
  const idx=C.map(t=>Q.findIndex(x=>tokEq(x,t)));
  // all candidate words found: prefer the procedure named first, with its words close together
  if(idx.every(i=>i>=0)){const lo=Math.min(...idx),gap=Math.max(...idx)-lo+1-C.length;return Math.min(.99,.75+.25*C.length/Q.length-.01*lo-.02*Math.max(0,gap));}
  if(Q.every(t=>C.some(x=>tokEq(x,t)))) return .6+.3*Q.length/C.length;
  return dice(q,c)*.9;
}
function matchOperation(text){
  const q=norm(text); let best={op:null,score:0};
  if(!q) return best;
  for(const op of S.operations){
    for(const cand of [op.name,...(op.aliases||[])]){
      const sc=scoreText(q,norm(cand));
      if(sc>best.score) best={op,score:sc};
    }
  }
  return best;
}
function matchLocation(text){
  const t=String(text||'').trim(); if(!t) return '';
  const q=norm(t);
  for(const l of S.locations) for(const c of [l.name,...(l.aliases||[])]) if(norm(c)===q) return l.name;
  for(const l of S.locations) for(const c of [l.name,...(l.aliases||[])]) if(scoreText(q,norm(c))>=.75) return l.name;
  const name=t.replace(/\b\w/g,c=>c.toUpperCase());
  S.locations.push({name,aliases:[]}); return name;
}
function matchRole(raw,comment){
  const n=String(raw||'').toLowerCase().trim(), c=String(comment||'').toLowerCase();
  const find=re=>(S.roles.find(r=>re.test(r.name.toLowerCase()))||{}).name;
  if(!n) return {role:'',note:'Role missing'};
  const exact=S.roles.find(r=>r.name.toLowerCase()===n); if(exact) return {role:exact.name};
  if(isScopeRole(String(raw).trim())) return {role:String(raw).trim()};
  if(/co.?primary/.test(n)) return {role:find(/co.?primary/)||raw};
  if(/unsupervised/.test(n)) return {role:find(/unsupervised/)||raw};
  if(/supervised/.test(n)) return {role:find(/^primary supervised/)||raw};
  if(/primary/.test(n)){
    if(/co.?primary/.test(c)) return {role:find(/co.?primary/),note:"Role taken from comment 'co-primary'",clearComment:/^\s*co.?primary\s*$/.test(c)};
    return {role:S.primaryAssumption};
  }
  if(/2|second/.test(n)) return {role:find(/^2/)||raw};
  if(/1|first|assist/.test(n)) return {role:find(/^1/)||raw};
  const r=String(raw).trim(); S.roles.push({name:r,primary:false}); return {role:r,note:'New role added'};
}
// Endoscopy: work out assisted / unassisted from the old role and comments
function scopeRole(raw,comment){
  const n=String(raw||'').toLowerCase(), c=String(comment||'').toLowerCase();
  if(/unassist/.test(n)||n==='primary unsupervised') return {role:'Unassisted'};
  if(n==='assisted') return {role:'Assisted'};
  if(/co.?primary/.test(n+' '+c)) return {role:'Assisted'};
  if(/no assist|did everything|unassisted|independent/.test(c)) return {role:'Unassisted'};
  if(/almost|except|couldn|could not|drew back|inserted some|took over|sigmoid|caecum|assist/.test(c)) return {role:'Assisted'};
  if(/assist/.test(n)) return {role:'Assisted'};
  return {role:'Assisted',note:'Scope: assisted / unassisted not recorded – assumed Assisted'};
}

const TITLES={dashboard:'Logbook',cases:'Cases',form:'Log a case',settings:'Settings',list:'Edit list',ops:'Operations',opEdit:'Operation',fields:'Form fields',import:'Review import',
  rotations:'Rotations',rotation:'Rotation',rotEdit:'Rotation',opStats:'Progress',backups:'Backups',aiTidy:'Tidy older cases',aiSummary:'AI summary'};
function go(v,p=null){ stack.push([view,param]); view=v; param=p; render(); window.scrollTo(0,0); }

function back(){ const [v,p]=stack.pop()||['dashboard',null]; view=v; param=p; render(); }
function render(){
  const root=ROOTS.includes(view), sheet=view==='form';

// Android back gesture: keep one history entry while inside a sub-screen
function syncHistory(){
  const inner=history.state&&history.state.inner;

}

function opSuggest(){
  const q=$('#f_op').value.trim(); let items;
  if(!q){ items=freqOps().map(n=>opByName(n)); }
  else {
    const nq=norm(q), lq=q.toLowerCase();
    items=S.operations.map(o=>{let s=0;const all=[o.name,...o.aliases];
      if(all.some(a=>a.toLowerCase().startsWith(lq)))s=2;else if(all.some(a=>a.toLowerCase().includes(lq)))s=1.5;else s=Math.max(...all.map(a=>scoreText(nq,norm(a))));
      return [o,s];}).filter(x=>x[1]>=.5).sort((a,b)=>b[1]-a[1]).slice(0,7).map(x=>x[0]);
  }
  const exact=S.operations.some(o=>o.name.toLowerCase()===q.toLowerCase());
  $('#opSug').innerHTML=(items.length||(q&&!exact))?`<div class="sugg">${!q&&items.length?'<div class="small muted" style="padding:8px 14px 4px">Frequently logged</div>':''}${items.map(o=>`<button type="button" data-act="pickOp" data-n="${esc(o.name)}">${esc(o.name)}<small>${esc(o.category)}</small></button>`).join('')}${q&&!exact?`<button type="button" class="new" data-act="newOpFocus">＋ Add “${esc(q)}” as a new operation</button>`:''}</div>`:'';
  checkNewOp(); updateRoles();
}
function checkNewOp(){
  const inp=$('#f_op'), q=inp.value.trim(), box=$('#newOp');
  if(!q||inp.dataset.newop!==q||S.operations.some(o=>o.name.toLowerCase()===q.toLowerCase())){box.hidden=true;return;}
  if(box.hidden||box.dataset.q!==q){
    const guess=matchOperation(q).op;
    box.hidden=false; box.dataset.q=q;
    box.innerHTML=`New operation – it will be added to your list.<br><select class="inp" id="newOpCat" aria-label="Category">${S.categories.map(c=>`<option${guess&&guess.category===c?' selected':''}>${esc(c)}</option>`).join('')}</select>`;
  }
}
async function saveCase(existing,then){
  const g=n=>(document.querySelector(`input[name="${n}"]:checked`)||{}).value||'';
  const val=id=>{const el=$('#'+id);return el?el.value.trim():undefined;};
  let op=val('f_op'); const date=val('f_date'), role=g('role');
  if(!date) return toast('Please add a date');
  if(!op) return toast('Please enter the operation');
  if(!role) return toast('Please choose your role');
  const known=S.operations.find(o=>o.name.toLowerCase()===op.toLowerCase());
  if(known) op=known.name;
  else {
    const m=matchOperation(op);
    const pick=m.op&&m.score>=.9?await ask(`Did you mean “${m.op.name}”?`,`“${op}” will be remembered as another name for it.`,[['use',`Use “${m.op.name}”`,'pri'],['new',`Add “${op}” as new`,''],['cancel','Keep editing','']]):'new';
    if(pick==='cancel') return;
    if(pick==='use'){
      if(!m.op.aliases.some(a=>a.toLowerCase()===op.toLowerCase())) m.op.aliases.push(op); op=m.op.name;
    } else {
      const box=$('#newOp');
      if(box.hidden){ $('#f_op').dataset.newop=op; checkNewOp(); box.scrollIntoView({block:'center'}); return toast('Choose a category for this new operation, then save'); }
      S.operations.push({name:op,category:$('#newOpCat').value||'Uncategorised',aliases:[],scope:false,steps:[]});
    }
  }
  const c=existing||{id:uid(),created:Date.now()};
  Object.assign(c,{date,operation:op,role,location:g('location'),comments:val('f_cm')||''});
  const set=(k,v)=>{ if(shown(k)) c[k]=v; };
  set('detail',val('f_detail')||''); set('urgency',g('urgency')); set('approach',g('approach')); set('asa',g('asa')); set('sex',g('sex'));
  set('consultant',val('f_cons')||''); set('complication',val('f_comp')||'');
  set('steps',$$('input[name="step"]:checked').map(e=>e.value));
  if(shown('converted')) c.converted=!!($('#f_conv')||{}).checked;
  if(shown('milestone')) c.milestone=!!($('#f_mile')||{}).checked;
  if(shown('age')){const a=val('f_age');c.age=a===''||a==null?null:+a;}
  c.custom=c.custom||{};
  S.customFields.forEach(f=>{ if(f.type==='select') c.custom[f.id]=g('cf_'+f.id); else {const el=document.querySelector(`[data-cf="${f.id}"]`); if(el) c.custom[f.id]=f.type==='yesno'?el.checked:(f.type==='number'&&el.value!==''?+el.value:el.value);} });
  c.updated=Date.now();
  if(c.consultant&&!S.consultants.includes(c.consultant)) S.consultants.push(c.consultant);
  if(c.location) S.lastLocation=c.location;
  if(!db.cases.includes(c)) db.cases.push(c); // also covers a case deleted on another device while this form was open
  save(); toast(existing?'Case updated':'Case saved ✓');
  formSnap=null;
  if(then) then(); else if(existing) back(); else goRoot('cases');
}

// Suggest terms from the cases: runs at one hospital with gaps under 6 weeks, merged when they overlap
function suggestRotations(){
  const byLoc={};
  db.cases.filter(c=>c.date&&c.location).sort((a,b)=>a.date.localeCompare(b.date)).forEach(c=>(byLoc[c.location]=byLoc[c.location]||[]).push(c.date));
  const runs=[];
  for(const [loc,ds] of Object.entries(byLoc)){ let cur=null; for(const d of ds){ if(cur&&daysBetween(cur.end,d)<=42) cur.end=d; else runs.push(cur={locations:[loc],start:d,end:d}); } }
  runs.sort((a,b)=>a.start.localeCompare(b.start));
  const out=[];
  for(const r of runs){ const o=out.find(x=>r.start<=x.end&&r.end>=x.start);
    if(o){ o.locations.push(...r.locations); if(r.end>o.end)o.end=r.end; } else out.push(r); }
  return out.map(s=>({...s,name:s.locations.join(' + '),n:rotCases(s).length}))
    .filter(s=>s.n>=3&&!S.rotations.some(r=>s.start<=r.end&&s.end>=r.start));
}

// The key lives outside the logbook data so it is never in a backup, export or snapshot.
const AI_KEY='logbook-ai-key';
const AI_SDK='https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.5.0/+esm';
const AI_MODELS=[['claude-opus-5-5','Opus 5.5 (standard)'],['claude-haiku-5-5','Haiku 5.5 (cheapest)']];
const aiKey=()=>{try{return localStorage.getItem(AI_KEY)||'';}catch(e){return '';}};
const aiModel=()=>S.aiModel||AI_MODELS[0][0];
// removes long numbers (possible URNs) and, unless keepDates, full dates (possible DOBs)
const deid=(s,keepDates)=>{let t=String(s??'').replace(/\b\d{6,}\b/g,'[number removed]');return keepDates?t:t.replace(/\b\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\b/g,'[date removed]');};
let aiSdk=null;
async function aiClient(key){
  if(!aiSdk) aiSdk=await import(AI_SDK).catch(()=>{throw new Error('Could not load the AI tool – are you online?');});
  return new aiSdk.default({apiKey:key,dangerouslyAllowBrowser:true}); // the key is the user's own and stays on their device
}
function aiErrorText(e){
  const A=aiSdk&&aiSdk.default;
  if(!A) return e.message;
  if(e instanceof A.AuthenticationError) return 'Your API key wasn’t accepted. Check it in Settings.';
  if(e instanceof A.PermissionDeniedError) return 'This key isn’t allowed to do that. Check it at console.anthropic.com.';
  if(e instanceof A.RateLimitError) return 'Too many requests, or your spending limit was reached. Try again shortly.';
  if(e instanceof A.BadRequestError) return 'Claude couldn’t take this request. Check your credit balance at console.anthropic.com.';
  if(e instanceof A.APIConnectionError) return 'Couldn’t reach Claude – are you online?';
  if(e instanceof A.APIError) return 'Claude is having trouble right now. Try again shortly.';
  return e.message;
}
async function aiRequest({system,user,schema,effort='low',maxTokens=4000,onText}){
  const client=await aiClient(aiKey()), model=aiModel();
  const params={model,max_tokens:maxTokens,system,messages:[{role:'user',content:user}],output_config:{effort,...(schema?{format:{type:'json_schema',schema}}:{})}};
  if(model==='claude-opus-5-5'){params.betas=['server-side-fallback-2026-07-01'];params.fallbacks='default';}
  const stream=client.beta.messages.stream(params);
  if(onText) stream.on('text',onText);
  const msg=await stream.finalMessage();
  if(msg.stop_reason==='refusal') throw new Error('Claude declined this request. Try rewording it.');
  if(msg.stop_reason==='max_tokens') throw new Error('The answer was too long. Try fewer cases.');
  const last=msg.content.map(b=>b.type).lastIndexOf('fallback'); // if a fallback model took over, only its answer counts
  const text=msg.content.slice(last+1).filter(b=>b.type==='text').map(b=>b.text).join('');
  return schema?JSON.parse(text):text;
}
// runs an AI action with its button showing progress and any failure shown in a dialog
async function aiBusy(btn,label,fn){
  const old=btn.textContent; btn.disabled=true; btn.textContent=label;
  try{ return await fn(); }
  catch(e){ notice('AI assistant',aiErrorText(e)); }
  finally{ btn.disabled=false; btn.textContent=old; }
}

async function aiTidyRun(){
  const list=tidyCases(); tidy={running:true,done:0,total:list.length,items:[],seen:[]}; render();
  const T=tidy;
  const schema={type:'object',additionalProperties:false,required:['results'],properties:{results:{type:'array',items:{type:'object',additionalProperties:false,required:['case','steps','milestone'],properties:{case:{type:'integer'},steps:{type:'array',items:{type:'string'}},milestone:{type:'boolean'}}}}}};
  try{

      const r=await aiRequest({schema,maxTokens:8000,
        system:`${AI_ROLE}\nFor each numbered case, read the comment and return a result. steps lists only steps from that case's list that the comment clearly shows the registrar personally did; "skin to skin" or "did everything" means all of them. If unclear, leave steps empty rather than guess. milestone is true only if the comment describes a first or a clear personal best.`,
        user:batch.map((c,k)=>`Case ${k}\nOperation: ${c.operation}\nRole: ${c.role||'not recorded'}\nSteps to choose from: ${(opByName(c.operation)||{steps:[]}).steps.join('; ')||'none'}\nComment: ${deid(c.comments)}`).join('\n\n')});

}
function aiTidySave(){

function syncHash(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677);}

  return (b>>>0).toString(36)+(a>>>0).toString(36);}

function adoptSettings(o){const keep={};SYNC_DEVICE_ONLY.forEach(k=>{if(S[k]!==undefined)keep[k]=S[k];});db.settings=S={...defaultSettings(),...o,...keep};migrate();}

  Object.keys(S).forEach(k=>{if(!Array.isArray(S[k])||!Array.isArray(r[k]))return;const seen=new Set(r[k].map(id));r[k]=r[k].concat(S[k].filter(x=>!seen.has(id(x))));});return r;}

// Record what has changed here since the account last held it
function syncScan(){
  if(!Y) return;
  const now=Date.now(), live=syncLive();
  live.forEach((json,k)=>{const h=syncHash(json),p=Y.pending[k];
    if(Y.base[k]===h){if(p)delete Y.pending[k];}
    else if(!p||p.h!==h) Y.pending[k]={t:now,h};});
  Object.keys(Y.base).forEach(k=>{const p=Y.pending[k];if(!live.has(k)&&(!p||p.h!==null))Y.pending[k]={t:now,h:null};});
  Object.keys(Y.pending).forEach(k=>{if(!live.has(k)&&!(k in Y.base))delete Y.pending[k];});

}

const syncItems=()=>fb.f.collection(fb.store,'users',syncUser.uid,'items');

// Send what's waiting. An item leaves the waiting list only once Google confirms it, so a closed app just resends.
async function syncFlush(){
  if(!Y||!syncUser||syncBusy||syncLinking||!navigator.onLine){syncShow();return;}
  syncScan();
  const keys=Object.keys(Y.pending);
  if(!keys.length){syncShow();return;}
  syncBusy=true; syncShow();
  const live=syncLive();
  try{
    for(let i=0;i<keys.length&&Y;i+=SYNC_BATCH){
      const part=keys.slice(i,i+SYNC_BATCH), sent={}, b=fb.f.writeBatch(fb.store);
      part.forEach(k=>{const p=sent[k]=Y.pending[k]; if(!p) return;
        const when={u:p.t,s:fb.f.serverTimestamp()};
        b.set(fb.f.doc(syncItems(),k),p.h===null?{...when,del:true}:{...when,d:live.get(k)});});
      await b.commit();
      if(!Y) break;
      part.forEach(k=>{const p=sent[k]; if(!p||Y.pending[k]!==p) return;
        delete Y.pending[k]; if(p.h===null) delete Y.base[k]; else Y.base[k]=p.h;});
      syncWrite();
    }
    syncErr='';
  }catch(e){syncErr=syncErrText(e);}
  syncBusy=false; syncShow();
  if(Y&&!syncErr&&Object.keys(Y.pending).length) syncChanged();
}

// Apply one document from the account. Returns true if this device's logbook changed.
function syncApply(k,r){
  const p=Y.pending[k];
  if(p&&!(r.u>p.t)) return false;      // the newer edit is the one here, and it's on its way
  if(p) delete Y.pending[k];
  if(k==='settings'){
    if(syncHash(r.d)===syncHash(settingsJson())){Y.base[k]=syncHash(r.d);return false;}
    adoptSettings(JSON.parse(r.d)); Y.base[k]=syncHash(settingsJson()); return true;
  }
  const id=k.slice(2), i=db.cases.findIndex(c=>c.id===id);
  if(r.del){ delete Y.base[k]; if(i<0) return false; db.cases.splice(i,1); return true; }
  Y.base[k]=syncHash(r.d);
  if(i<0){db.cases.push(JSON.parse(r.d));return true;}
  const c=db.cases[i];
  if(JSON.stringify(c)===r.d) return false;
  // same object, so a form open on this case keeps pointing at it
  Object.keys(c).forEach(x=>delete c[x]); Object.assign(c,JSON.parse(r.d)); return true;
}
function syncIncoming(snap){
  if(!Y) return;
  syncScan();   // catch any edit from the last moment before comparing
  let changed=false;
  snap.docChanges().forEach(x=>{
    if(x.type==='removed'||x.doc.metadata.hasPendingWrites) return;
    const r=x.doc.data();
    if(syncApply(x.doc.id,r)) changed=true;
    if(r.s&&r.s.toMillis()>Y.cursor) Y.cursor=r.s.toMillis();
  });
  syncWrite();
  if(changed){ save(false); syncRefresh(); }
  else syncShow();
}
function syncRefresh(){  // never redraw over a form, a dialog or something being typed
  if(ROOTS.includes(view)&&$('#modal').hidden&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')) render();
  else syncShow();
}
function syncListen(){
  if(syncStop) syncStop();
  const q=fb.f.query(syncItems(),fb.f.where('s','>=',fb.f.Timestamp.fromMillis(Y.cursor||0)));
  syncStop=fb.f.onSnapshot(q,syncIncoming,e=>{syncStop=null;syncErr=syncErrText(e);syncShow();});
}

async function syncLink(){

    snap.docs.forEach(d=>{const r=d.data();remote[d.id]=r;if(!r.del&&d.id!=='settings')rCases++;if(r.s&&r.s.toMillis()>cursor)cursor=r.s.toMillis();});
    const unique=db.cases.filter(c=>{const r=remote['c_'+c.id];return !r||r.del||r.d!==JSON.stringify(c);}).length;
    let k='merge';

        [['merge','Combine them','pri'],['account','Use my account’s copy only','dng'],['cancel','Not now','']]);

function summaryRows(list=db.cases){
  const m={}; list.forEach(c=>{const o=m[c.operation]||(m[c.operation]={});o[c.role]=(o[c.role]||0)+1;});
  const anyScope=list.some(c=>isScopeRole(c.role));
  return Object.keys(m).sort((a,b)=>catOf(a).localeCompare(catOf(b))||a.localeCompare(b)).map(op=>{
    const r={Category:catOf(op),Operation:op}; let p=0;
    S.roles.forEach(x=>{const v=m[op][x.name]||0;r[x.name]=v;if(x.primary)p+=v;});

const csvCell=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
function toCSV(rows){if(!rows.length)return '';const h=Object.keys(rows[0]);return [h.map(csvCell).join(','),...rows.map(r=>h.map(k=>csvCell(r[k])).join(','))].join('\r\n');}
function parseCSV(t){
  t=t.replace(/^﻿/,''); const rows=[]; let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===','){row.push(f);f='';} else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n')i++; row.push(f);rows.push(row);row=[];f=''; } else f+=ch; }
  if(f||row.length){row.push(f);rows.push(row);} return rows;
}
function parseDate(v){
  if(v instanceof Date) return isNaN(v)?'':ymd(v);
  const s=String(v??'').trim(); if(!s) return ''; let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) return `${m[3].length===2?'20'+m[3]:m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if(/^\d{5}(\.\d+)?$/.test(s)){const d=new Date(Math.round((+s-25569)*864e5));return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;}
  const d=new Date(s); return isNaN(d)?'':ymd(d);
}

function prepareImport(arr,fileName){
  const headers=(arr[0]||[]).map(h=>String(h).trim()); const idx={}, ignored=[], cfIdx={};
  headers.forEach((h,i)=>{const l=h.toLowerCase();
    const cfm=S.customFields.find(f=>f.label.toLowerCase()===l); if(cfm){cfIdx[cfm.id]=i;return;}
    if(IDENT.test(l)){ignored.push(h);return;}
    const hit=COLS.find(([k,re])=>re.test(l)&&idx[k]==null); if(hit) idx[hit[0]]=i; else if(h) ignored.push(h);});
  if(idx.operation==null) return toast('Could not find an “Operation” column in this file');
  const rows=arr.slice(1).filter(r=>r.some(v=>String(v??'').trim()));
  const rowsOut=rows.map(r=>{
    const get=k=>idx[k]!=null?r[idx[k]]:'';
    const notes=[]; let comments=String(get('comments')||'').trim();
    if(get('importNote')) String(get('importNote')).split('; ').filter(x=>!/assumed Primary supervised/.test(x)).forEach(x=>notes.push(x));
    const ts=parseDate(get('timestamp')); let date=parseDate(get('date'));
    if(!date&&ts){date=ts;notes.push('Date missing – used form submission date');}
    else if(date&&ts&&date>ts) notes.push('Operation date is after the form was submitted – please check');
    let raw=String(get('operation')||'').trim();
    if(!raw&&comments){const m=matchOperation(comments);if(m.score>=.75){raw=m.op.name;notes.push('Operation was blank – identified from comments');}}
    const m=matchOperation(raw);
    const choice=m.score>=.6?m.op.name:(raw?'NEW':'');
    let rr;
    if(choice&&choice!=='NEW'&&isScopeOp(choice)) rr=String(get('role')).trim()?scopeRole(get('role'),comments):{role:'',note:'Role missing'};
    else rr=matchRole(get('role'),comments);
    if(rr.note&&!notes.includes(rr.note)) notes.push(rr.note); if(rr.clearComment) comments='';
    let age=get('age')!==''?parseInt(get('age'),10):null;
    if((age==null||isNaN(age))&&idx.dob!=null){const dob=parseDate(get('dob'));if(dob&&date&&dob<date){const a=+date.slice(0,4)-+dob.slice(0,4)-(date.slice(5)<dob.slice(5)?1:0);age=a>=0&&a<120?a:null;}}
    const custom={}; S.customFields.forEach(f=>{if(cfIdx[f.id]!=null){const v=r[cfIdx[f.id]];custom[f.id]=f.type==='yesno'?yes(v):v;}});
    return {raw,choice,score:m.score,c:{id:uid(),created:Date.now(),date,role:rr.role,location:matchLocation(get('location')),detail:String(get('detail')||'').trim(),
      urgency:matchList('urgencies',get('urgency')),approach:matchList('approaches',get('approach')),asa:matchList('asa',get('asa')),consultant:matchList('consultants',get('consultant')),
      age:isNaN(age)?null:age,sex:matchList('sexes',get('sex')),converted:yes(get('converted')),complication:matchList('complications',get('complication')),milestone:yes(get('milestone')),
      comments,custom,steps:String(get('steps')||'').split(';').map(s=>s.trim()).filter(Boolean),orig:String(get('orig')||'')||(choice&&choice!=='NEW'&&norm(raw)!==norm(choice)?raw:''),importNote:notes.join('; ')}};
  });
  pending={fileName,rows:rowsOut,ignored,showAll:false};
  go('import');
}

    ${r.c.importNote?`<div class="small" style="margin-top:4px"><span class="badge warn">note</span> ${esc(r.c.importNote)}</div>`:''}
  </div>`;}).join('')||'<p class="muted">Everything matched confidently.</p>'}</div>
  <div class="savebar"><button class="btn" data-act="impCancel" style="flex:0 0 auto">Cancel</button><button class="btn pri" data-act="impGo">Import ${plural(P.rows.length,'case')}</button></div>`;
}
function doImport(){
  const skip=$('#skipDup').checked; const key=c=>[c.date,c.operation,c.role,c.location,(c.comments||'').slice(0,20)].join('|');
  const have=new Set(db.cases.map(key)); let added=0,dup=0,noop=0;
  snapshot('Before import');
  for(const r of pending.rows){
    let op=r.choice;
    if(op==='NEW'){ op=r.raw; if(!opByName(op)) S.operations.push({name:op,category:'Uncategorised',aliases:[],scope:false,steps:[]}); }
    if(!op){noop++;continue;}
    if(op!==r.raw&&r.raw&&opByName(op)&&!r.c.orig&&norm(op)!==norm(r.raw)) r.c.orig=r.raw;
    const c={...r.c,operation:op};
    if(isScopeOp(op)&&c.role&&!isScopeRole(c.role)) c.role=scopeRole(c.role,c.comments).role;
    if(skip&&have.has(key(c))){dup++;continue;}
    db.cases.push(c); added++;
  }
  pending=null; save(); toast(`Imported ${added}${dup?`, skipped ${dup} duplicates`:''}${noop?`, ${noop} without an operation`:''}`); goRoot('dashboard');
}
async function handleFile(file){
  const name=file.name, ext=name.split('.').pop().toLowerCase();
  try{
    const text=['json','txt','csv'].includes(ext)?await file.text():null;
    if(ext==='json'||(ext==='txt'&&/^\s*\{/.test(text))){
      const j=JSON.parse(text); if(!j||!Array.isArray(j.cases)) throw new Error('Not a logbook backup file');
      const k=await ask('Restore backup?',`This backup has ${plural(j.cases.length,'case')}.`,[['merge','Add missing cases','pri'],['replace','Replace everything','dng'],['cancel','Cancel','']]);
      if(k!=='cancel') snapshot('Before restoring a backup');
      if(k==='replace'){ db={cases:j.cases,settings:{...defaultSettings(),...j.settings}}; S=db.settings; }
      else if(k==='merge'){ const ids=new Set(db.cases.map(c=>c.id)); db.cases.push(...j.cases.filter(c=>!ids.has(c.id)));
        (j.settings?.operations||[]).forEach(o=>{if(!opByName(o.name))S.operations.push(o);}); }
      else return;
      migrate(); toast('Backup restored'); goRoot('dashboard'); return;
    }
    let arr;
    if(ext==='csv'||ext==='txt') arr=parseCSV(text);
    else { await loadXLSX(); const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true}); const ws=wb.Sheets['Cases']||wb.Sheets[wb.SheetNames[0]]; arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}); }
    prepareImport(arr,name);
  }catch(e){ notice('Import failed',e.message); }
}

  if(e.target.closest('#modal')) return;
  const r=e.target.closest('input[type=radio][data-desel]');
  if(r){ if(r.dataset.on==='1'){r.checked=false;r.dataset.on='';} else {$$(`input[name="${r.name}"]`).forEach(x=>x.dataset.on='');r.dataset.on='1';} return; }
  const t=e.target.closest('[data-act]'); if(t&&ACT[t.dataset.act]){ e.preventDefault(); ACT[t.dataset.act](t,e); }
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&CHG[t.dataset.chg])CHG[t.dataset.chg](t);});
document.addEventListener('input',e=>{const t=e.target.closest('[data-inp]');if(t&&INP[t.dataset.inp])INP[t.dataset.inp](t);});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)handleFile(f);});
/* ---------- Installable app ---------- */
let installEvt=null;
const isInstalled=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(view==='settings')render();});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('Installed – find Logbook on your home screen');});
// offline copy of the app (skipped on this computer's preview server so edits show immediately)
if('serviceWorker' in navigator&&location.hostname!=='localhost') navigator.serviceWorker.register('sw.js').catch(()=>{});
// ask the phone not to clear this app's data when storage runs low
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});

migrate();
snapshot('Automatic');
render();
if(Y) syncSdk().catch(()=>{syncShow();});   // loaded only once signed in, so the app opens offline as before
</script>
